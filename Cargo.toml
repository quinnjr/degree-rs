[package]
name = "degree-rs"
version = "1.0.0"
edition = "2021"
authors = ["Joseph Quinn <quinn.josephr@protonmail.com>"]
description = "Rust implementation of the Degree centrality plugin for PluMA"
license = "MIT"

[lib]
name = "degree_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "degree"
path = "src/main.rs"

[dependencies]
csv = "1.3"
pluma-plugin-trait = "1.1.0"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.8.0"

[[bench]]
name = "degree_bench"
harness = false
